[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql"
version = "0.1.0"
description = "Text-to-SQL interface with guardrails and hallucination detection."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "litellm>=1.40",
    "python-dotenv>=1.0",
    "sqlparse>=0.5",
    "faker>=20",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "httpx>=0.27,<1",
    "streamlit>=1.32,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "testcontainers[postgresql]>=4.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
text2sql = "text2sql.cli:main"
text2sql-api = "text2sql._entrypoints:run_api"
text2sql-ui = "text2sql._entrypoints:run_ui"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
